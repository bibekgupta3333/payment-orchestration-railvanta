name: railvanta

services:
  api:
    image: railvanta-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      APP_ENV: sandbox
      HTTP_ADDR: :8080
      HEALTH_ADDR: 127.0.0.1:8081
      SQLITE_PATH: /var/lib/railvanta/railvanta.db
      PUBLIC_APP_ORIGIN: http://localhost:${RAILVANTA_PORT:-3000}
      DEMO_MODE: "false"
    expose:
      - "8080"
    volumes:
      - railvanta-data:/var/lib/railvanta
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    init: true
    stop_grace_period: 15s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    image: railvanta-web:local
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_INTERNAL_ORIGIN: http://api:8080
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /app/frontend/.next/cache:uid=1000,gid=1000,mode=0700
    init: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "127.0.0.1:${RAILVANTA_PORT:-3000}:8080"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
        restart: true
      web:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  railvanta-data:
