name: railvanta

services:
  api:
    image: ${RAILVANTA_API_IMAGE:-railvanta-api:local}
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      args:
        RAILVANTA_RELEASE: ${RAILVANTA_RELEASE:-dev}
        RAILVANTA_GIT_SHA: ${RAILVANTA_GIT_SHA:-}
    environment:
      APP_ENV: sandbox
      HTTP_ADDR: :8080
      HEALTH_ADDR: 127.0.0.1:8081
      SQLITE_PATH: /var/lib/railvanta/railvanta.db
      PUBLIC_APP_ORIGIN: http://localhost:${RAILVANTA_PORT:-3000}
      DEMO_MODE: "false"
      # One-click visitor sessions in the shared demo workspace (POST /v1/sandbox/session).
      # Safe only because the proxy is loopback-only and this is a sandbox with no real
      # funds: anyone who can reach it gets operator rights. Never enable on a shared host.
      SANDBOX_PUBLIC_ACCESS: "true"
    expose:
      - "8080"
    volumes:
      - railvanta-data:/var/lib/railvanta
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    init: true
    stop_grace_period: 15s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    image: ${RAILVANTA_WEB_IMAGE:-railvanta-web:local}
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_INTERNAL_ORIGIN: http://api:8080
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /app/frontend/.next/cache:uid=1000,gid=1000,mode=0700
    init: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  proxy:
    # stable-alpine, pinned by digest (WBS 5.2.11); bump deliberately.
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    ports:
      - "127.0.0.1:${RAILVANTA_PORT:-3000}:8080"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
        restart: true
      web:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  railvanta-data:
    # The default equals Compose's generated name. The restore script points
    # RAILVANTA_DATA_VOLUME at a freshly restored volume and keeps the old one.
    name: ${RAILVANTA_DATA_VOLUME:-railvanta_railvanta-data}
