name: M1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 11.3.0
          node-version-file: "false"
          install: false
          cache: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Go dependencies
        run: go -C backend mod download
      - name: Run formatting, lint, contracts, type checks, tests and builds
        run: pnpm check
      - name: Install Chromium
        run: pnpm --filter @railvanta/e2e exec playwright install --with-deps chromium
      - name: Run the cumulative black-box suite
        run: pnpm test:e2e
      - name: Upload browser reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
