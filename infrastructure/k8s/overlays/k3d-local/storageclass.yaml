# Disposable-cluster example: k3s local-path with a Retain reclaim policy.
# Node-local storage; a node loss is downtime. Replace for other clusters.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: railvanta-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
