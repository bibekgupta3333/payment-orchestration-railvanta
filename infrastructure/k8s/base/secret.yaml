# PLACEHOLDER ONLY. Never commit real values; create the real Secret out of
# band (kubectl create secret, sealed-secrets, external-secrets, ...).
# The current API reads no secrets; this Secret reserves the name for session
# material and later provider sandbox credentials, and is mounted nowhere yet.
apiVersion: v1
kind: Secret
metadata:
  name: railvanta-api-secrets
type: Opaque
stringData:
  PLACEHOLDER_SESSION_SECRET: REPLACE_ME_OUT_OF_BAND
