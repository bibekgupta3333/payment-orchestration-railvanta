apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: railvanta-sandbox
labels:
  - pairs:
      app.kubernetes.io/part-of: railvanta
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - secret.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicies.yaml
# Images default to the names the Compose build produces. Override with real
# digests at deploy time (see docs/operations/kubernetes.md), for example:
#   kustomize edit set image railvanta-api=<registry>/railvanta-api@sha256:<digest>
images:
  - name: railvanta-api
    newTag: local
  - name: railvanta-web
    newTag: local
