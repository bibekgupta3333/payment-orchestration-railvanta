apiVersion: v1
kind: Service
metadata:
  name: railvanta-web
  labels:
    app.kubernetes.io/name: railvanta-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: railvanta-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: railvanta-web
  labels:
    app.kubernetes.io/name: railvanta-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: railvanta-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railvanta-web
    spec:
      serviceAccountName: railvanta-web
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: railvanta-web:local
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef: {name: railvanta-config, key: WEB_NODE_ENV}
            - name: PORT
              valueFrom:
                configMapKeyRef: {name: railvanta-config, key: WEB_PORT}
            - name: HOSTNAME
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/frontend/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 128Mi
