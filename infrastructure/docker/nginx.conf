server {
    listen 8080;
    server_name _;
    client_max_body_size 64k;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API health is on its own container-loopback listener and stays private.
    location ^~ /health/ {
        return 404;
    }

    location = /v1 {
        proxy_pass http://api:8080;
        # A stopped API container leaves a dead IP: fail fast with 502 instead of
        # waiting out the ARP/connect timeout.
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /v1/ {
        # No trailing URI on proxy_pass: preserve the complete /v1 path.
        proxy_pass http://api:8080;
        # A stopped API container leaves a dead IP: fail fast with 502 instead of
        # waiting out the ARP/connect timeout.
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
