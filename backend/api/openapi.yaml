        computed from posted entries only (drafts never count), ordered by currency then code. Totals use
        checked int64 arithmetic, so when a total or balance does not fit in int64 the account reports
        balance_error amount_overflow and null amounts, never a rounded number. Balances are per account
        and per currency and are never added across currencies. balance_minor is debits minus credits for
        asset and expense accounts and credits minus debits for the others (normal_balance says which).
      responses:
        default: *id001
