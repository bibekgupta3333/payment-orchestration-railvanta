openapi: 3.0.3
info:
  title: Railvanta Sandbox API
  version: 0.1.0
  description: Implements authentication, workspace and payment-method reads, idempotent
    payment acceptance (WBS 2.1) and workspace-scoped payment, attempt and list reads.
    Payment execution and operational routes remain explicitly unavailable (501) until
    later WBS packages. Decimal-string money preserves exact int64 minor units.
  license:
    name: Private project
servers:
- url: http://localhost:8080
  description: Local sandbox API (same-origin /v1 proxy in frontend)
tags:
- name: Sandbox
  description: Authenticated sandbox operations
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: Read authenticated workspace
      tags:
      - Sandbox
      responses:
        default: &id001
          $ref: '#/components/responses/Error'
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/workspaces/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id002
        type: string
        format: uuid
    get:
      operationId: getWorkspaceByID
      summary: Read an authorized workspace
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/session:
    get:
      operationId: getSession
      summary: Read current workspace and role
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
