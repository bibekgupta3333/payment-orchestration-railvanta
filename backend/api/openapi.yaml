  /v1/sandbox/webhooks/mock:
    post:
      operationId: receiveMockWebhook
      summary: Sandbox-only inbound mock provider event
      description: Operator-only sandbox route that feeds the webhook inbox so duplicate, changed-payload
        and reordered deliveries can be exercised. Mock events are not signed (signature_status
        not_applicable). The first delivery of an event ID is processed through status-guarded transitions
        and answers 202. A byte-identical repeat increments duplicate_count and answers 200 with no further
