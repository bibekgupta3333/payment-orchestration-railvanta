openapi: 3.0.3
info:
  title: Railvanta Sandbox API
  version: 0.1.0
  description: Implements authentication, workspace and payment-method reads, idempotent
    payment acceptance (WBS 2.1), workspace-scoped payment, attempt and list reads,
    read-only routing evaluation (WBS 2.2) and posted ledger journals (WBS 2.3). Accepted
    payments are executed asynchronously by the in-process outbox dispatcher against
    the deterministic mock provider. Other operational routes remain explicitly unavailable
    (501) until later WBS packages. Decimal-string money preserves exact int64 minor units.
  license:
    name: Private project
servers:
- url: http://localhost:8080
  description: Local sandbox API (same-origin /v1 proxy in frontend)
tags:
- name: Sandbox
  description: Authenticated sandbox operations
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: Read authenticated workspace
      tags:
      - Sandbox
      responses:
        default: &id001
          $ref: '#/components/responses/Error'
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/workspaces/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id002
        type: string
        format: uuid
    get:
      operationId: getWorkspaceByID
      summary: Read an authorized workspace
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/session:
    get:
      operationId: getSession
      summary: Read current workspace and role
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payment-methods:
    get:
      operationId: listPaymentMethods
      summary: Read safe sandbox payment methods
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: cursor
        in: query
        required: false
        schema: &id003
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payment-methods/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    get:
      operationId: getPaymentMethod
      summary: Read one authorized method
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments:
    get:
      operationId: listPayments
      summary: List workspace payments
      description: Newest-first keyset pagination over the authenticated workspace's
        payments. Pass next_cursor back as cursor; it is opaque. Optional status filter.
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id003
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PaymentStatus'
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
    post:
      operationId: createPayment
      summary: Accept a sandbox payment
      description: Idempotently accepts a payment. One short transaction reserves
        (workspace, operation, Idempotency-Key), inserts the payment and its initial
        audit transition, appends a payment.dispatch outbox command and stores this
        202 response. Reusing the key with the same canonical request (amount, currency,
        payment method, merchant reference) replays the stored body byte-for-byte with
        Idempotent-Replayed true; a different request returns 409 idempotency_conflict.
        Validation and authorization failures never reserve the key. The method must
        belong to the workspace (else 404) and hold a provider token (else 422).
      tags:
      - Sandbox
      responses:
        default: *id001
        '202':
          description: Accepted (or replayed); poll the Location for current state
          headers:
            X-Request-ID:
              schema:
                type: string
            Location:
              description: Relative URL of the accepted payment
              schema:
                type: string
            Idempotent-Replayed:
              description: Present and true when the stored response is replayed
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '422': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - name: X-CSRF-Token
        in: header
        required: false
        schema: *id003
        description: Required with a valid Origin for cookie-authenticated writes.
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    get:
      operationId: getPayment
      summary: Read a payment
      description: Returns current state, independent of the original acceptance
        snapshot. Another workspace's payment ID returns 404.
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments/{id}/attempts:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    get:
      operationId: listAttempts
      summary: Read provider attempts
      description: Attempts in attempt-number order. Empty until the dispatcher claims
        the payment; then one attempt records the routed provider, rule and reason,
        submitted_at (set before the provider call) and completed_at (set when the attempt
        succeeds or fails; null while unknown). The provider idempotency key is never
        exposed. Another workspace's payment ID returns 404.
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attempt'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    post:
      operationId: cancelPayment
      summary: Cancel a created payment
      description: Moves a payment from created to canceled with a status- and version-guarded
        update that also settles the pending dispatch command, so it races dispatch
        safely and exactly one side wins. Returns 200 with the canceled payment (also
        when it was already canceled) and 409 not_cancelable once dispatch has claimed
        it or it is in any other state. No request body. Another workspace's payment
        ID returns 404.
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: The payment is canceled
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema: *id003
        description: Required with a valid Origin for cookie-authenticated writes.
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments/{id}/recovery:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    get:
      operationId: getPaymentRecovery
      summary: Read a payment's recovery state
      description: 'Shows whether an unknown outcome is awaiting a lookup at the original
        provider (lookup_status, lookup_attempts, next_lookup_at) and lists provider
        results that arrived after a conflicting terminal state. Those late outcomes
        are never applied; they are recorded for reconciliation. retry_allowed is
        always false: unknown outcomes are resolved by lookup, never by a new attempt.'
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecovery'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Read observed sandbox metrics
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSummary'
        '501': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      description: Contract for a later work package. The M1 server returns 501 not_implemented
        after authentication and any implemented validation.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id003
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/dashboard/payment-volume:
    get:
      operationId: getPaymentVolume
      summary: Read volume grouped by currency
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VolumePoint'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '501': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      description: Contract for a later work package. The M1 server returns 501 not_implemented
        after authentication and any implemented validation.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id003
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/providers/health:
    get:
      operationId: getProviderHealth
      summary: Read provider observations
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderHealth'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '501': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      description: Contract for a later work package. The M1 server returns 501 not_implemented
        after authentication and any implemented validation.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id003
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/routing/rules:
    get:
      operationId: getRoutingRules
      summary: Read routing rules
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoutingRule'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '501': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      description: Contract for a later work package. The M1 server returns 501 not_implemented
        after authentication and any implemented validation.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id003
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/routing/evaluate:
    post:
      operationId: evaluateRouting
      summary: Evaluate without moving money
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingDecision'
        '503': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '400': *id001
        '413': *id001
        '415': *id001
        '422':
          $ref: '#/components/responses/Error'
      description: Read-only. Returns the provider, rule and reason the dispatcher would
        choose for a payment with this method, amount and currency, using the same router
        as real dispatch (enabled provider with a token for the method, an enabled rule matching
        rail, currency and inclusive amount bounds, lowest priority first, and an executing
        adapter). Writes nothing and moves no money; requires operator role. 404 for a method
        outside the workspace; 422 no_eligible_provider when nothing matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingEvaluation'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/ledger/transactions:
    get:
      operationId: getLedgerTransactions
      summary: Read immutable posted journals
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerJournal'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '400': *id001
        '503': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      description: Posted journals only (drafts are never visible), newest first by
        (created_at, id) with an opaque keyset cursor, scoped to the authenticated workspace.
        Optional payment_id filter. Amounts are decimal-string int64 minor units; each
        journal's debits equal its credits in its single currency. A payment success debits
        provider_clearing:{provider_id} and credits merchant_payable.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id003
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: payment_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/reconciliation/runs:
    get:
      operationId: getReconciliationRuns
      summary: Read reconciliation runs
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationRun'
                  next_cursor:
