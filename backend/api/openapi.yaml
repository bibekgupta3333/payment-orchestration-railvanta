components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: High-entropy prefix.secret API key; only hashes stored
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-railvanta_session
      description: Secure HttpOnly host-only session. Cookie writes require Origin
        and X-CSRF-Token.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id003
        message: *id003
        request_id: *id003
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field: *id003
              message: *id003
            required:
            - field
            - message
      required:
      - code
      - message
      - request_id
      - field_errors
    Workspace:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id003
        environment:
          type: string
          enum:
          - sandbox
      required:
      - id
      - name
      - environment
    Session:
      type: object
      additionalProperties: false
      properties:
        workspace_id: *id002
        role:
          type: string
          enum:
          - read
          - operator
      required:
      - workspace_id
      - role
    PaymentMethod:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        rail:
          type: string
          enum:
          - mock
          - card
          - ach
        brand: *id003
        last_four:
          type: string
          pattern: ^[0-9]{4}$
      required:
      - id
      - rail
      - brand
      - last_four
    CreatePayment:
      type: object
      additionalProperties: false
      properties:
        amount_minor: &id004
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          example: '25000'
          description: Positive signed int64 minor units, encoded as a decimal string.
            Server additionally enforces the int64 maximum 9223372036854775807. Currency
            exponents govern display, not divisibility of minor units.
        currency: &id005
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - JPY
          - KWD
        payment_method_id: *id002
        merchant_reference:
          type: string
          maxLength: 255
      required:
      - amount_minor
      - currency
      - payment_method_id
    PaymentStatus:
      type: string
      enum:
      - created
      - processing
      - succeeded
      - failed
      - canceled
      - unknown
    Payment:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        amount_minor: *id004
        currency: *id005
        payment_method_id: *id002
        merchant_reference:
          type: string
          maxLength: 255
          nullable: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - amount_minor
      - currency
      - payment_method_id
      - merchant_reference
      - status
      - created_at
      - updated_at
    Attempt:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        payment_id: *id002
        provider_id: *id002
        attempt_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - created
          - submitted
          - succeeded
          - failed
          - unknown
        routing_rule_id:
          type: string
          format: uuid
          nullable: true
        routing_reason: *id003
        provider_reference:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - payment_id
      - provider_id
      - attempt_number
      - status
      - routing_rule_id
      - routing_reason
      - provider_reference
      - error_code
      - submitted_at
      - completed_at
      - created_at
    PaymentRecovery:
      type: object
      additionalProperties: false
      properties:
        payment_id: *id002
        lookup_status:
          type: string
          enum:
          - none
          - pending
          - in_progress
          - resolved
          - failed
        lookup_attempts:
          type: integer
          minimum: 0
        next_lookup_at:
          type: string
          format: date-time
          nullable: true
        last_lookup_error:
          type: string
          nullable: true
        retry_allowed:
          type: boolean
          enum:
          - false
        late_outcomes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              attempt_id: *id002
              outcome:
                type: string
                enum:
                - succeeded
                - declined
                - ambiguous
              provider_reference:
                type: string
                nullable: true
              code:
                type: string
                nullable: true
              payment_status:
                $ref: '#/components/schemas/PaymentStatus'
              attempt_status:
                type: string
              source:
                type: string
                enum:
                - dispatch
                - lookup
              observed_at:
                type: string
                format: date-time
            required:
            - attempt_id
            - outcome
            - provider_reference
            - code
            - payment_status
            - attempt_status
            - source
            - observed_at
      required:
      - payment_id
      - lookup_status
      - lookup_attempts
      - next_lookup_at
      - last_lookup_error
      - retry_allowed
      - late_outcomes
    MetricSummary:
      type: object
      additionalProperties: false
      properties:
        data_source:
          type: string
          enum:
          - observed
          - simulated
          - seeded
        payment_count:
          type: integer
          minimum: 0
        volumes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              currency: *id005
              amount_minor: *id004
            required:
            - currency
            - amount_minor
      required:
      - data_source
      - payment_count
      - volumes
    VolumePoint:
      type: object
      additionalProperties: false
      properties:
        timestamp:
          type: integer
          format: int64
        currency: *id005
        amount_minor: *id004
      required:
      - timestamp
      - currency
      - amount_minor
    ProviderHealth:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        configured:
          type: boolean
        data_source: *id003
        observation_count:
          type: integer
          minimum: 0
      required:
      - id
      - configured
      - data_source
      - observation_count
    RoutingRule:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        provider_id: *id002
        currency: *id005
        priority:
          type: integer
          minimum: 0
        enabled:
          type: boolean
      required:
      - id
      - provider_id
      - currency
      - priority
      - enabled
    RoutingEvaluation:
      type: object
      additionalProperties: false
      properties:
        payment_method_id: *id002
        amount_minor: *id004
        currency: *id005
      required:
      - payment_method_id
      - amount_minor
      - currency
    RoutingDecision:
      type: object
      additionalProperties: false
      properties:
        provider_id: *id002
        provider_code:
          type: string
          enum:
          - mock
          - stripe
          - plaid
        rule_id: *id002
        priority:
          type: integer
          minimum: 0
        reason: *id003
      required:
      - provider_id
      - provider_code
      - rule_id
      - priority
      - reason
    LedgerJournal:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        payment_id:
          type: string
          format: uuid
          nullable: true
        currency: *id005
        status:
          type: string
          enum:
          - posted
        posting_key: *id003
        reversal_of:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        posted_at:
          type: string
          format: date-time
        entries:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            properties:
              id: *id002
              account_id: *id002
              account_code:
                type: string
                description: merchant_payable or provider_clearing:{provider_id}
              provider_id:
                type: string
                format: uuid
                nullable: true
              side:
                type: string
                enum:
                - debit
                - credit
              amount_minor: *id004
            required:
            - id
            - account_id
            - account_code
            - provider_id
            - side
            - amount_minor
      required:
      - id
      - payment_id
      - currency
      - status
      - posting_key
      - reversal_of
      - created_at
      - posted_at
      - entries
    ReconciliationRun:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
      required:
      - id
      - status
    Discrepancy:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        kind:
          type: string
          enum:
          - missing_posting
          - unknown_outcome
          - amount_mismatch
          - status_mismatch
          - missing_at_provider
        status:
          type: string
          enum:
          - open
          - investigating
          - resolved
      required:
      - id
      - kind
      - status
    Event:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        event_type: *id003
        status: *id003
        data_source: *id003
      required:
      - id
      - event_type
      - status
      - data_source
    SimulationRequest:
      type: object
      additionalProperties: false
      properties:
        scenario:
          type: string
          enum:
          - success
          - decline
          - timeout_before_execution
          - timeout_after_success
          - duplicate_request
          - duplicate_webhook
          - reordered_events
          - outage
          - unknown_recovery
          - duplicate_posting
        payment:
          $ref: '#/components/schemas/CreatePayment'
      required:
      - scenario
      - payment
    Simulation:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        status: *id003
        payment_id: *id002
      required:
      - id
      - status
      - payment_id
  responses:
    Error:
      description: Safe error envelope; code describes validation, authorization,
        rate limits, missing resources or unimplemented capability.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
