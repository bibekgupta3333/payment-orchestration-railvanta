            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      description: Persisted run with the evidence read from the real pipeline. Invariants stay pending until the backend stored evidence for them.
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/api-keys/current:
    delete:
      operationId: revokeCurrentAPIKey
      summary: Revoke the authenticated operator API key
      description: Only the API key presented on this request is revoked. Cookie authentication cannot
        revoke an API key.
      tags:
      - Sandbox
      security:
      - bearerAuth: []
      responses:
        '204':
          description: API key revoked
          headers:
            X-Request-ID:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /v1/payments/{id}/history:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id006
    get:
      operationId: getPaymentHistory
      summary: Read payment state history and durable events
      description: Append-only state transitions, outbox events for the payment and the masked idempotency
        key (at most the last four characters). Another workspace's payment ID returns 404.
      tags:
      - Sandbox
      responses:
        default: *id003
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHistory'
        '401': *id003
        '403': *id003
        '404': *id003
        '429': *id003
        '503': *id003
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: High-entropy prefix.secret API key; only hashes stored
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-railvanta_session
      description: Secure HttpOnly host-only session. Cookie writes require Origin and X-CSRF-Token.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id005
        message: *id005
        request_id: *id005
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field: *id005
              message: *id005
            required:
            - field
            - message
      required:
      - code
      - message
      - request_id
      - field_errors
    Workspace:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id005
        environment:
          type: string
          enum:
          - sandbox
      required:
      - id
      - name
      - environment
    Session:
      type: object
      additionalProperties: false
      properties:
        workspace_id: *id002
        role:
          type: string
          enum:
          - read
          - operator
      required:
      - workspace_id
      - role
    PaymentMethod:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        rail:
          type: string
          enum:
          - mock
          - card
          - ach
        brand: *id005
        last_four:
          type: string
          pattern: ^[0-9]{4}$
      required:
      - id
      - rail
      - brand
      - last_four
    CreatePayment:
      type: object
      additionalProperties: false
      properties:
        amount_minor: &id007
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          example: '25000'
          description: Positive signed int64 minor units, encoded as a decimal string. Server additionally
            enforces the int64 maximum 9223372036854775807. Currency exponents govern display, not divisibility
            of minor units.
        currency: &id008
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - JPY
          - KWD
        payment_method_id: *id002
        merchant_reference:
          type: string
          maxLength: 255
      required:
      - amount_minor
      - currency
      - payment_method_id
    PaymentStatus:
      type: string
      enum:
      - created
      - processing
      - succeeded
      - failed
      - canceled
      - unknown
    Payment:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        amount_minor: *id007
        currency: *id008
        payment_method_id: *id002
        merchant_reference:
          type: string
          maxLength: 255
          nullable: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - amount_minor
      - currency
      - payment_method_id
      - merchant_reference
      - status
      - created_at
      - updated_at
    Attempt:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        payment_id: *id002
        provider_id: *id002
        attempt_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - created
          - submitted
          - succeeded
          - failed
          - unknown
        routing_rule_id:
          type: string
          format: uuid
          nullable: true
        routing_reason: *id005
        provider_reference:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - payment_id
      - provider_id
      - attempt_number
      - status
      - routing_rule_id
      - routing_reason
      - provider_reference
      - error_code
      - submitted_at
      - completed_at
      - created_at
    PaymentRecovery:
      type: object
      additionalProperties: false
      properties:
        payment_id: *id002
        lookup_status:
          type: string
          enum:
          - none
          - pending
          - in_progress
          - resolved
          - failed
        lookup_attempts:
          type: integer
          minimum: 0
        next_lookup_at:
          type: string
          format: date-time
          nullable: true
        last_lookup_error:
          type: string
          nullable: true
        retry_allowed:
          type: boolean
          enum:
          - false
        late_outcomes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              attempt_id: *id002
              outcome:
                type: string
                enum:
                - succeeded
                - declined
                - ambiguous
              provider_reference:
                type: string
                nullable: true
              code:
                type: string
                nullable: true
              payment_status:
                $ref: '#/components/schemas/PaymentStatus'
              attempt_status:
                type: string
              source:
                type: string
                enum:
                - dispatch
                - lookup
              observed_at:
                type: string
                format: date-time
            required:
            - attempt_id
            - outcome
            - provider_reference
            - code
            - payment_status
            - attempt_status
            - source
            - observed_at
      required:
      - payment_id
      - lookup_status
      - lookup_attempts
      - next_lookup_at
      - last_lookup_error
      - retry_allowed
      - late_outcomes
    MetricSummary:
      type: object
      additionalProperties: false
      properties:
        data_source:
          $ref: '#/components/schemas/DataSource'
        window:
          $ref: '#/components/schemas/MetricWindow'
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time
        payment_count:
          type: integer
          minimum: 0
        status_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        volumes:
          description: Accepted volume (all statuses) per currency.
          type: array
          items:
            $ref: '#/components/schemas/CurrencyVolume'
        succeeded_volumes:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyVolume'
        terminal_count:
          type: integer
          minimum: 0
          description: Succeeded plus failed payments in the window.
        success_rate_percent:
          type: string
          nullable: true
          pattern: ^[0-9]{1,3}\.[0-9]$
          description: Succeeded / (succeeded + failed) with one decimal; null without observations.
        completion_latency_p95_ms:
          type: integer
          nullable: true
          minimum: 0
          description: Nearest-rank p95 of acceptance-to-terminal time; null without observations.
        completion_latency_samples:
          type: integer
          minimum: 0
      required:
      - data_source
      - window
      - window_start
      - window_end
      - generated_at
      - payment_count
      - status_counts
      - volumes
      - succeeded_volumes
      - terminal_count
      - success_rate_percent
      - completion_latency_p95_ms
      - completion_latency_samples
    VolumePoint:
      type: object
      additionalProperties: false
      properties:
        timestamp:
          type: integer
          format: int64
          description: Bucket start in Unix milliseconds (UTC).
        currency: &id009
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - JPY
          - KWD
        amount_minor:
          $ref: '#/components/schemas/AggregateAmount'
        payment_count:
          type: integer
          minimum: 0
      required:
      - timestamp
      - currency
      - amount_minor
      - payment_count
    ProviderHealthWindow:
      type: object
      additionalProperties: false
      properties:
        window:
          type: string
          enum:
          - 1h
          - 24h
          - 7d
        observations:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
        success_rate_percent:
          type: string
          nullable: true
          description: One-decimal percentage; null when there are no observations.
        p95_ms:
          type: integer
          nullable: true
          description: null when no attempt has both submitted_at and completed_at.
        latency_samples:
          type: integer
          minimum: 0
        error_counts:
          type: object
          additionalProperties:
            type: integer
      required:
      - window
      - observations
      - succeeded
      - failed
      - unknown
      - success_rate_percent
      - p95_ms
      - latency_samples
      - error_counts
    ProviderHealth:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        code:
          type: string
          enum:
          - mock
          - stripe
          - plaid
        configured:
          type: boolean
        data_source:
          $ref: '#/components/schemas/DataSource'
        observation_count:
          type: integer
          minimum: 0
          description: Observations in the 7d window.
        status:
          type: string
          enum:
          - no_observations
          - insufficient_data
          - healthy
          - degraded
          - unhealthy
        windows:
          type: array
          items:
            $ref: '#/components/schemas/ProviderHealthWindow'
      required:
      - id
      - code
      - configured
      - data_source
      - observation_count
      - status
      - windows
    Provider:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        code:
          type: string
          enum:
          - mock
          - stripe
          - plaid
        display_name:
          type: string
        mode:
          type: string
          enum:
          - simulated
          - configured
          - not_configured
        enabled:
          type: boolean
        configured:
          type: boolean
        capabilities:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            idempotent_replay:
              type: boolean
            lookup_by_idempotency_key:
              type: boolean
            rails:
              type: array
              items:
                type: string
          required:
          - idempotent_replay
          - lookup_by_idempotency_key
          - rails
        rule_count:
          type: integer
          minimum: 0
      required:
      - id
      - code
      - display_name
      - mode
      - enabled
      - configured
      - capabilities
      - rule_count
    ProviderDetail:
      type: object
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        health:
          $ref: '#/components/schemas/ProviderHealth'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRule'
      required:
      - provider
      - health
      - rules
    RoutingRule:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        provider_id:
          type: string
        provider_code:
          type: string
        rail:
          type: string
        currency:
          type: string
        priority:
          type: integer
          minimum: 0
        min_amount_minor:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        max_amount_minor:
          type: string
          nullable: true
          pattern: ^(0|[1-9][0-9]*)$
        enabled:
          type: boolean
      required:
      - id
      - provider_id
      - provider_code
      - rail
      - currency
      - priority
      - min_amount_minor
      - max_amount_minor
      - enabled
    RoutingEvaluation:
      type: object
      additionalProperties: false
      properties:
        payment_method_id: *id002
        amount_minor: *id007
        currency: *id008
        payment_id:
          type: string
          description: Optional existing payment; an unresolved prior attempt blocks failover.
      required:
      - payment_method_id
      - amount_minor
      - currency
    RoutingCheck:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        passed:
          type: boolean
        detail:
          type: string
      required:
      - id
      - label
      - passed
      - detail
    RoutingDecision:
      type: object
      additionalProperties: false
      properties:
        provider_id:
          type: string
        provider_code:
          type: string
          enum:
          - mock
          - stripe
          - plaid
        rule_id:
          type: string
          nullable: true
        priority:
          type: integer
          minimum: 0
          nullable: true
        reason:
          type: string
        rule:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/RoutingRule'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/RoutingCheck'
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              provider_id:
                type: string
              provider_code:
                type: string
              rule_id:
                type: string
              priority:
                type: integer
            required:
            - provider_id
            - provider_code
            - rule_id
            - priority
        failover_blocked:
          type: boolean
      required:
      - provider_id
      - provider_code
      - rule_id
      - priority
      - reason
      - rule
      - checks
      - candidates
      - failover_blocked
    LedgerJournal:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        payment_id:
          type: string
          format: uuid
          nullable: true
        currency: *id008
        status:
          type: string
          enum:
          - posted
        posting_key: *id005
        reversal_of:
          type: string
          format: uuid
          nullable: true
        reversed_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        posted_at:
          type: string
          format: date-time
        entries:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            properties:
              id: *id002
              account_id: *id002
              account_code:
                type: string
                description: merchant_payable or provider_clearing:{provider_id}
              provider_id:
                type: string
                format: uuid
                nullable: true
              side:
                type: string
                enum:
                - debit
                - credit
              amount_minor: *id007
            required:
            - id
            - account_id
            - account_code
            - provider_id
            - side
            - amount_minor
      required:
      - id
      - payment_id
      - currency
      - status
      - posting_key
      - reversal_of
      - reversed_by
      - created_at
      - posted_at
      - entries
    ReconciliationCounts:
      type: object
      additionalProperties: false
      properties:
        compared:
          type: integer
          minimum: 0
          description: Settled mock-provider payments created in the window.
        matched:
          type: integer
          minimum: 0
          description: Compared payments with no discrepancy.
        unmatched:
          type: integer
          minimum: 0
          description: missing_posting, unknown_outcome and missing_at_provider discrepancies.
        mismatch:
          type: integer
          minimum: 0
          description: amount_mismatch and status_mismatch discrepancies.
      required:
      - compared
      - matched
      - unmatched
      - mismatch
    ReconciliationRun:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        run_key: *id005
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        requested_by:
          type: string
          nullable: true
        counts:
          $ref: '#/components/schemas/ReconciliationCounts'
        evidence_consumed_count:
          type: integer
          minimum: 0
          description: payment.late_outcome rows consumed as evidence by this run.
        simulated:
          type: boolean
          description: Always true; evidence comes from the mock provider.
      required:
      - id
      - run_key
      - status
      - window_start
      - window_end
      - created_at
      - completed_at
      - requested_by
      - counts
      - evidence_consumed_count
      - simulated
    StartReconciliationRunRequest:
      type: object
      additionalProperties: false
      properties:
        window_start:
          type: string
          format: date-time
          description: Inclusive RFC 3339 start; payments are matched on created_at.
        window_end:
          type: string
          format: date-time
          description: Exclusive RFC 3339 end; must be after window_start and at most 366 days later.
      required:
      - window_start
      - window_end
    DiscrepancyKind:
      type: string
      enum:
      - missing_posting
      - unknown_outcome
      - amount_mismatch
      - status_mismatch
      - missing_at_provider
    DiscrepancyStatus:
      type: string
      enum:
      - open
      - investigating
      - resolved
    DiscrepancyEvidence:
      type: object
      description: Stored evidence (details). Money is a decimal string. Always simulated mock data.
      additionalProperties: false
      properties:
        source:
          type: string
          enum:
          - mock_provider
        simulated:
          type: boolean
        summary:
          type: string
        expected:
          type: string
        payment:
          type: object
          additionalProperties: false
          properties:
            id: *id002
            status: *id005
            amount_minor: *id005
            currency: *id005
          required:
          - id
          - status
          - amount_minor
          - currency
        provider_charge:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            id: *id005
            provider_reference: *id005
            status: *id005
            amount_minor: *id005
            currency: *id005
            scenario: *id005
          required:
          - id
          - provider_reference
          - status
          - amount_minor
          - currency
          - scenario
        journal:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            id: *id002
            debit_total_minor: *id005
            credit_total_minor: *id005
          required:
          - id
          - debit_total_minor
          - credit_total_minor
        late_outcomes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              event_id: *id005
              outcome: *id005
              source: *id005
              payment_status: *id005
              attempt_status: *id005
              observed_at:
                type: integer
                format: int64
            required:
            - event_id
            - outcome
            - source
            - payment_status
            - attempt_status
            - observed_at
      required:
      - source
      - simulated
      - summary
      - payment
      - provider_charge
      - journal
      - late_outcomes
    ResolutionEvent:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        from_status:
          $ref: '#/components/schemas/DiscrepancyStatus'
        to_status:
          $ref: '#/components/schemas/DiscrepancyStatus'
        note: *id005
        actor: *id005
        created_at:
          type: string
          format: date-time
      required:
      - id
      - from_status
      - to_status
      - note
      - actor
      - created_at
    Discrepancy:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        run_id: *id002
        payment_id:
          type: string
          format: uuid
          nullable: true
        kind:
          $ref: '#/components/schemas/DiscrepancyKind'
        status:
          $ref: '#/components/schemas/DiscrepancyStatus'
        details:
          $ref: '#/components/schemas/DiscrepancyEvidence'
        resolution_note:
          type: string
          nullable: true
        resolved_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        related_journal_id:
          type: string
          format: uuid
          nullable: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/ResolutionEvent'
        simulated:
          type: boolean
      required:
      - id
      - run_id
      - payment_id
      - kind
      - status
      - details
      - resolution_note
      - resolved_by
      - created_at
      - resolved_at
      - related_journal_id
      - history
      - simulated
    ResolveDiscrepancyRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/DiscrepancyStatus'
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: Required for every status change.
      required:
      - status
      - note
    LedgerAccount:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        code:
          type: string
          description: merchant_payable or provider_clearing:{provider_id}
        kind:
          type: string
          enum:
          - asset
          - liability
          - income
          - expense
          - equity
        currency: *id008
        provider_id:
          type: string
          format: uuid
          nullable: true
        provider_code:
          type: string
          nullable: true
        debit_total_minor:
          type: string
          nullable: true
          description: Decimal-string int64 minor units; null when balance_error is set.
        credit_total_minor:
          type: string
          nullable: true
        balance_minor:
          type: string
          nullable: true
        balance_error:
          type: string
          nullable: true
          enum:
          - amount_overflow
          - null
        normal_balance:
          type: string
          enum:
          - debit
          - credit
        entry_count:
          type: integer
          minimum: 0
      required:
      - id
      - code
      - kind
      - currency
      - provider_id
      - provider_code
      - debit_total_minor
      - credit_total_minor
      - balance_minor
      - balance_error
      - normal_balance
      - entry_count
    LedgerJournalDetail:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        payment_id:
          type: string
          format: uuid
          nullable: true
