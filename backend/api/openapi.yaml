        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
