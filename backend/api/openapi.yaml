components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: High-entropy prefix.secret API key; only hashes stored
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-railvanta_session
      description: Secure HttpOnly host-only session. Cookie writes require Origin and X-CSRF-Token.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id005
        message: *id005
        request_id: *id005
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field: *id005
              message: *id005
            required:
            - field
            - message
      required:
      - code
      - message
      - request_id
      - field_errors
    Workspace:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id005
        environment:
          type: string
          enum:
          - sandbox
      required:
      - id
      - name
      - environment
    Session:
      type: object
      additionalProperties: false
      properties:
        workspace_id: *id002
        role:
          type: string
          enum:
          - read
          - operator
      required:
      - workspace_id
      - role
    PaymentMethod:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        rail:
          type: string
          enum:
          - mock
          - card
          - ach
        brand: *id005
        last_four:
          type: string
          pattern: ^[0-9]{4}$
      required:
      - id
      - rail
      - brand
      - last_four
    CreatePayment:
      type: object
      additionalProperties: false
      properties:
        amount_minor: &id007
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          example: '25000'
          description: Positive signed int64 minor units, encoded as a decimal string. Server additionally
            enforces the int64 maximum 9223372036854775807. Currency exponents govern display, not divisibility
            of minor units.
        currency: &id008
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - JPY
          - KWD
        payment_method_id: *id002
        merchant_reference:
          type: string
          maxLength: 255
      required:
      - amount_minor
      - currency
      - payment_method_id
    PaymentStatus:
      type: string
      enum:
      - created
      - processing
      - succeeded
      - failed
      - canceled
      - unknown
    Payment:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        amount_minor: *id007
        currency: *id008
        payment_method_id: *id002
        merchant_reference:
          type: string
          maxLength: 255
          nullable: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - amount_minor
      - currency
      - payment_method_id
      - merchant_reference
      - status
      - created_at
      - updated_at
    Attempt:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        payment_id: *id002
        provider_id: *id002
        attempt_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - created
          - submitted
          - succeeded
          - failed
          - unknown
        routing_rule_id:
          type: string
          format: uuid
          nullable: true
        routing_reason: *id005
        provider_reference:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - payment_id
      - provider_id
      - attempt_number
      - status
      - routing_rule_id
      - routing_reason
      - provider_reference
      - error_code
      - submitted_at
      - completed_at
      - created_at
    PaymentRecovery:
      type: object
      additionalProperties: false
      properties:
        payment_id: *id002
        lookup_status:
          type: string
          enum:
          - none
          - pending
          - in_progress
          - resolved
          - failed
        lookup_attempts:
          type: integer
          minimum: 0
        next_lookup_at:
          type: string
          format: date-time
          nullable: true
        last_lookup_error:
          type: string
          nullable: true
        retry_allowed:
          type: boolean
          enum:
          - false
        late_outcomes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              attempt_id: *id002
              outcome:
                type: string
                enum:
                - succeeded
                - declined
                - ambiguous
              provider_reference:
                type: string
                nullable: true
              code:
                type: string
                nullable: true
              payment_status:
                $ref: '#/components/schemas/PaymentStatus'
              attempt_status:
                type: string
              source:
                type: string
                enum:
                - dispatch
                - lookup
              observed_at:
                type: string
                format: date-time
            required:
            - attempt_id
            - outcome
            - provider_reference
            - code
            - payment_status
            - attempt_status
            - source
            - observed_at
      required:
      - payment_id
      - lookup_status
      - lookup_attempts
      - next_lookup_at
      - last_lookup_error
      - retry_allowed
      - late_outcomes
    MetricSummary:
      type: object
      additionalProperties: false
      properties:
        data_source:
          $ref: '#/components/schemas/DataSource'
        window:
          $ref: '#/components/schemas/MetricWindow'
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time
        payment_count:
          type: integer
          minimum: 0
        status_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        volumes:
          description: Accepted volume (all statuses) per currency.
          type: array
          items:
            $ref: '#/components/schemas/CurrencyVolume'
        succeeded_volumes:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyVolume'
        terminal_count:
          type: integer
          minimum: 0
          description: Succeeded plus failed payments in the window.
        success_rate_percent:
          type: string
          nullable: true
          pattern: ^[0-9]{1,3}\.[0-9]$
          description: Succeeded / (succeeded + failed) with one decimal; null without observations.
        completion_latency_p95_ms:
          type: integer
          nullable: true
          minimum: 0
          description: Nearest-rank p95 of acceptance-to-terminal time; null without observations.
        completion_latency_samples:
          type: integer
          minimum: 0
      required:
      - data_source
      - window
      - window_start
      - window_end
      - generated_at
      - payment_count
      - status_counts
      - volumes
      - succeeded_volumes
      - terminal_count
      - success_rate_percent
      - completion_latency_p95_ms
      - completion_latency_samples
