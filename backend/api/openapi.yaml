openapi: 3.0.3
info:
  title: Railvanta Sandbox API
  version: 0.1.0
  description: Implements authentication, workspace and payment-method reads, idempotent payment acceptance
    (WBS 2.1), workspace-scoped payment, attempt, history and list reads, observed dashboard metrics (WBS
    3.1), read-only routing evaluation (WBS 2.2), posted ledger journals (WBS 2.3), and cancellation and
    recovery reads (WBS 2.4). Accepted payments are executed asynchronously by the in-process outbox dispatcher
    against the deterministic mock provider. Routing rules, provider capabilities and health, and a
    backend-driven sandbox simulator are read or run through WBS 3.2. Other operational routes remain explicitly
    unavailable (501) until later WBS packages. Decimal-string money preserves exact int64 minor units.
  license:
    name: Private project
servers:
- url: http://localhost:8080
  description: Local sandbox API (same-origin /v1 proxy in frontend)
tags:
- name: Sandbox
  description: Authenticated sandbox operations
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: Read authenticated workspace
      tags:
      - Sandbox
      responses:
        default: &id001
          $ref: '#/components/responses/Error'
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/workspaces/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id002
        type: string
        format: uuid
    get:
      operationId: getWorkspaceByID
      summary: Read an authorized workspace
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/session:
    get:
      operationId: getSession
      summary: Read current workspace and role
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payment-methods:
    get:
      operationId: listPaymentMethods
      summary: Read safe sandbox payment methods
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: cursor
        in: query
        required: false
        schema: &id005
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payment-methods/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    get:
      operationId: getPaymentMethod
      summary: Read one authorized method
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments:
    get:
      operationId: listPayments
      summary: List workspace payments
      description: Keyset pagination over the authenticated workspace's payments, newest first by default.
        Pass next_cursor back as cursor; it is opaque and bound to the sort. Optional search and status,
        currency, rail, provider, date and amount filters.
      tags:
      - Sandbox
      responses:
        default: &id003
          $ref: '#/components/responses/Error'
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '400': *id003
        '401': *id003
        '403': *id003
        '404': *id003
        '429': *id003
        '503': *id003
      parameters:
      - name: cursor
        in: query
        required: false
        schema: &id004
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PaymentStatus'
      - name: q
        in: query
        required: false
        description: Exact payment ID or exact merchant_reference.
        schema:
          type: string
          maxLength: 255
      - name: currency
        in: query
        required: false
        schema:
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - JPY
          - KWD
      - name: rail
        in: query
        required: false
        description: Rail of the payment method.
        schema:
          type: string
          enum:
          - card
          - ach
          - mock
      - name: provider_id
        in: query
        required: false
        description: Payments with at least one attempt routed to this provider.
        schema: &id006
          type: string
          format: uuid
      - name: created_from
        in: query
        required: false
        description: Inclusive lower bound; YYYY-MM-DD (UTC) or RFC 3339.
        schema:
          type: string
      - name: created_to
        in: query
        required: false
        description: Upper bound; a YYYY-MM-DD date includes that UTC day, an RFC 3339 timestamp is exclusive.
        schema:
          type: string
      - name: amount_min
        in: query
        required: false
        description: Inclusive minimum in minor units.
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
      - name: amount_max
        in: query
        required: false
        description: Inclusive maximum in minor units.
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
      - name: sort
        in: query
        required: false
        description: Keyset order. A cursor is valid only for the sort that issued it.
        schema:
          type: string
          enum:
          - created_desc
          - created_asc
          default: created_desc
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
    post:
      operationId: createPayment
      summary: Accept a sandbox payment
      description: Idempotently accepts a payment. One short transaction reserves (workspace, operation,
        Idempotency-Key), inserts the payment and its initial audit transition, appends a payment.dispatch
        outbox command and stores this 202 response. Reusing the key with the same canonical request (amount,
        currency, payment method, merchant reference) replays the stored body byte-for-byte with Idempotent-Replayed
        true; a different request returns 409 idempotency_conflict. Validation and authorization failures
        never reserve the key. The method must belong to the workspace (else 404) and hold a provider
        token (else 422).
      tags:
      - Sandbox
      responses:
        default: *id003
        '202':
          description: Accepted (or replayed); poll the Location for current state
          headers:
            X-Request-ID:
              schema:
                type: string
            Location:
              description: Relative URL of the accepted payment
              schema:
                type: string
            Idempotent-Replayed:
              description: Present and true when the stored response is replayed
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400': *id003
        '401': *id003
        '403': *id003
        '404': *id003
        '409': *id003
        '413': *id003
        '415': *id003
        '422': *id003
        '429': *id003
        '500': *id003
        '503': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - name: X-CSRF-Token
        in: header
        required: false
        schema: *id004
        description: Required with a valid Origin for cookie-authenticated writes.
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    get:
      operationId: getPayment
      summary: Read a payment
      description: Returns current state, independent of the original acceptance snapshot. Another workspace's
        payment ID returns 404.
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments/{id}/attempts:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    get:
      operationId: listAttempts
      summary: Read provider attempts
      description: Attempts in attempt-number order. Empty until the dispatcher claims the payment; then
        one attempt records the routed provider, rule and reason, submitted_at (set before the provider
        call) and completed_at (set when the attempt succeeds or fails; null while unknown). The provider
        idempotency key is never exposed. Another workspace's payment ID returns 404.
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attempt'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    post:
      operationId: cancelPayment
      summary: Cancel a created payment
      description: Moves a payment from created to canceled with a status- and version-guarded update
        that also settles the pending dispatch command, so it races dispatch safely and exactly one side
        wins. Returns 200 with the canceled payment (also when it was already canceled) and 409 not_cancelable
        once dispatch has claimed it or it is in any other state. No request body. Another workspace's
        payment ID returns 404.
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: The payment is canceled
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema: *id005
        description: Required with a valid Origin for cookie-authenticated writes.
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments/{id}/recovery:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    get:
      operationId: getPaymentRecovery
      summary: Read a payment's recovery state
      description: 'Shows whether an unknown outcome is awaiting a lookup at the original provider (lookup_status,
        lookup_attempts, next_lookup_at) and lists provider results that arrived after a conflicting terminal
        state. Those late outcomes are never applied; they are recorded for reconciliation. retry_allowed
        is always false: unknown outcomes are resolved by lookup, never by a new attempt.'
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecovery'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Read observed sandbox metrics
      description: Workspace-scoped metrics over payments created in the window. Volumes are grouped per
        currency as exact decimal strings (never summed across currencies). success_rate_percent and completion_latency_p95_ms
        are null when no succeeded or failed payment was observed.
      tags:
      - Sandbox
      responses:
        default: *id003
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSummary'
        '400': *id003
        '401': *id003
        '403': *id003
        '429': *id003
        '503': *id003
      parameters:
      - name: window
        in: query
        required: false
        description: Observation window ending now; 24h uses hourly buckets, 7d and 30d daily buckets.
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          default: 24h
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/dashboard/payment-volume:
    get:
      operationId: getPaymentVolume
      summary: Read volume grouped by currency
      description: Accepted payment volume per time bucket and currency for the workspace. Only non-empty
        buckets are returned; amounts are exact decimal strings.
      tags:
      - Sandbox
      responses:
        default: *id003
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data_source:
                    $ref: '#/components/schemas/DataSource'
                  window:
                    $ref: '#/components/schemas/MetricWindow'
                  bucket:
                    type: string
                    enum:
                    - hour
                    - day
                  window_start:
                    type: string
                    format: date-time
                  window_end:
                    type: string
                    format: date-time
                  generated_at:
                    type: string
                    format: date-time
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VolumePoint'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - data_source
                - window
                - bucket
                - window_start
                - window_end
                - generated_at
                - items
                - next_cursor
        '400': *id003
        '401': *id003
        '403': *id003
        '429': *id003
        '503': *id003
      parameters:
      - name: window
        in: query
        required: false
        description: Observation window ending now; 24h uses hourly buckets, 7d and 30d daily buckets.
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          default: 24h
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/providers:
    get:
      operationId: listProviders
      summary: Read providers and their capabilities
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '401': *id001
        '403': *id001
        '429': *id001
      description: Stored providers plus every known provider code without a row. Mock is simulated; a provider with no adapter in this build is not_configured.
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/providers/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Provider ID or code
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,64}$
    get:
      operationId: getProvider
      summary: Read one provider with health and rules
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetail'
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/sandbox/scenarios:
    get:
      operationId: listScenarios
      summary: List simulator scenarios
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioCatalog'
        '401': *id001
        '403': *id001
        '429': *id001
      description: Every scenario the simulator knows. Scenarios the backend cannot run yet are implemented false and name the missing dependency.
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/providers/health:
    get:
      operationId: getProviderHealth
      summary: Read provider observations
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderHealth'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '422':
          $ref: '#/components/responses/Error'
      description: Provider health computed from attempt submitted_at and completed_at over 1h, 24h and 7d windows. A provider with no attempts reports status no_observations and null rates, never zeros.
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id005
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: X-Request-ID
        in: header
        required: false
