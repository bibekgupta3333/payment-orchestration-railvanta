components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: High-entropy prefix.secret API key; only hashes stored
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-railvanta_session
      description: Secure HttpOnly host-only session. Cookie writes require Origin and X-CSRF-Token.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id005
        message: *id005
        request_id: *id005
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field: *id005
              message: *id005
            required:
            - field
            - message
      required:
      - code
      - message
      - request_id
      - field_errors
    Workspace:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id005
        environment:
          type: string
          enum:
          - sandbox
      required:
      - id
      - name
      - environment
    Session:
      type: object
      additionalProperties: false
      properties:
        workspace_id: *id002
        role:
          type: string
          enum:
          - read
          - operator
      required:
      - workspace_id
      - role
    PaymentMethod:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        rail:
          type: string
          enum:
          - mock
          - card
          - ach
        brand: *id005
        last_four:
          type: string
          pattern: ^[0-9]{4}$
      required:
      - id
      - rail
      - brand
      - last_four
    CreatePayment:
      type: object
      additionalProperties: false
      properties:
        amount_minor: &id007
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          maxLength: 19
          example: '25000'
          description: Positive signed int64 minor units, encoded as a decimal string. Server additionally
            enforces the int64 maximum 9223372036854775807. Currency exponents govern display, not divisibility
            of minor units.
        currency: &id008
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - JPY
          - KWD
        payment_method_id: *id002
        merchant_reference:
          type: string
          maxLength: 255
      required:
      - amount_minor
      - currency
      - payment_method_id
    PaymentStatus:
      type: string
      enum:
      - created
      - processing
      - succeeded
      - failed
      - canceled
      - unknown
    Payment:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        amount_minor: *id007
        currency: *id008
        payment_method_id: *id002
        merchant_reference:
          type: string
          maxLength: 255
          nullable: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - amount_minor
      - currency
      - payment_method_id
      - merchant_reference
      - status
      - created_at
      - updated_at
    Attempt:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        payment_id: *id002
        provider_id: *id002
        attempt_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - created
          - submitted
          - succeeded
          - failed
          - unknown
        routing_rule_id:
          type: string
          format: uuid
          nullable: true
        routing_reason: *id005
        provider_reference:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - payment_id
      - provider_id
      - attempt_number
      - status
      - routing_rule_id
      - routing_reason
      - provider_reference
      - error_code
      - submitted_at
      - completed_at
      - created_at
    PaymentRecovery:
      type: object
      additionalProperties: false
      properties:
        payment_id: *id002
        lookup_status:
          type: string
          enum:
          - none
          - pending
          - in_progress
          - resolved
          - failed
        lookup_attempts:
          type: integer
          minimum: 0
        next_lookup_at:
          type: string
          format: date-time
          nullable: true
        last_lookup_error:
          type: string
          nullable: true
        retry_allowed:
          type: boolean
          enum:
          - false
        late_outcomes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              attempt_id: *id002
              outcome:
                type: string
                enum:
                - succeeded
                - declined
                - ambiguous
              provider_reference:
                type: string
                nullable: true
              code:
                type: string
                nullable: true
              payment_status:
                $ref: '#/components/schemas/PaymentStatus'
              attempt_status:
                type: string
              source:
                type: string
                enum:
                - dispatch
                - lookup
              observed_at:
                type: string
                format: date-time
            required:
            - attempt_id
            - outcome
            - provider_reference
            - code
            - payment_status
            - attempt_status
            - source
            - observed_at
      required:
      - payment_id
      - lookup_status
      - lookup_attempts
      - next_lookup_at
      - last_lookup_error
      - retry_allowed
      - late_outcomes
    MetricSummary:
      type: object
      additionalProperties: false
      properties:
        data_source:
          $ref: '#/components/schemas/DataSource'
        window:
          $ref: '#/components/schemas/MetricWindow'
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time
        payment_count:
          type: integer
          minimum: 0
        status_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        volumes:
          description: Accepted volume (all statuses) per currency.
          type: array
          items:
            $ref: '#/components/schemas/CurrencyVolume'
        succeeded_volumes:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyVolume'
        terminal_count:
          type: integer
          minimum: 0
          description: Succeeded plus failed payments in the window.
        success_rate_percent:
          type: string
          nullable: true
          pattern: ^[0-9]{1,3}\.[0-9]$
          description: Succeeded / (succeeded + failed) with one decimal; null without observations.
        completion_latency_p95_ms:
          type: integer
          nullable: true
          minimum: 0
          description: Nearest-rank p95 of acceptance-to-terminal time; null without observations.
        completion_latency_samples:
          type: integer
          minimum: 0
      required:
      - data_source
      - window
      - window_start
      - window_end
      - generated_at
      - payment_count
      - status_counts
      - volumes
      - succeeded_volumes
      - terminal_count
      - success_rate_percent
      - completion_latency_p95_ms
      - completion_latency_samples
    VolumePoint:
      type: object
      additionalProperties: false
      properties:
        timestamp:
          type: integer
          format: int64
          description: Bucket start in Unix milliseconds (UTC).
        currency: &id009
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - JPY
          - KWD
        amount_minor:
          $ref: '#/components/schemas/AggregateAmount'
        payment_count:
          type: integer
          minimum: 0
      required:
      - timestamp
      - currency
      - amount_minor
      - payment_count
    ProviderHealthWindow:
      type: object
      additionalProperties: false
      properties:
        window:
          type: string
          enum:
          - 1h
          - 24h
          - 7d
        observations:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
        success_rate_percent:
          type: string
          nullable: true
          description: One-decimal percentage; null when there are no observations.
        p95_ms:
          type: integer
          nullable: true
          description: null when no attempt has both submitted_at and completed_at.
        latency_samples:
          type: integer
          minimum: 0
        error_counts:
          type: object
          additionalProperties:
            type: integer
      required:
      - window
      - observations
      - succeeded
      - failed
      - unknown
      - success_rate_percent
      - p95_ms
      - latency_samples
      - error_counts
    ProviderHealth:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        code:
          type: string
          enum:
          - mock
          - stripe
          - plaid
        configured:
          type: boolean
        data_source:
          $ref: '#/components/schemas/DataSource'
        observation_count:
          type: integer
          minimum: 0
          description: Observations in the 7d window.
        status:
          type: string
          enum:
          - no_observations
          - insufficient_data
          - healthy
          - degraded
          - unhealthy
        windows:
          type: array
          items:
            $ref: '#/components/schemas/ProviderHealthWindow'
      required:
      - id
      - code
      - configured
      - data_source
      - observation_count
      - status
      - windows
    Provider:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        code:
          type: string
          enum:
          - mock
          - stripe
          - plaid
        display_name:
          type: string
        mode:
          type: string
          enum:
          - simulated
          - configured
          - not_configured
        enabled:
          type: boolean
        configured:
          type: boolean
        capabilities:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            idempotent_replay:
              type: boolean
            lookup_by_idempotency_key:
              type: boolean
            rails:
              type: array
              items:
                type: string
          required:
          - idempotent_replay
          - lookup_by_idempotency_key
          - rails
        rule_count:
          type: integer
          minimum: 0
      required:
      - id
      - code
      - display_name
      - mode
      - enabled
      - configured
      - capabilities
      - rule_count
    ProviderDetail:
      type: object
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        health:
          $ref: '#/components/schemas/ProviderHealth'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRule'
      required:
      - provider
      - health
      - rules
    RoutingRule:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        provider_id:
          type: string
        provider_code:
          type: string
        rail:
          type: string
        currency:
          type: string
        priority:
          type: integer
          minimum: 0
        min_amount_minor:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        max_amount_minor:
          type: string
          nullable: true
          pattern: ^(0|[1-9][0-9]*)$
        enabled:
          type: boolean
      required:
      - id
      - provider_id
      - provider_code
      - rail
      - currency
      - priority
      - min_amount_minor
      - max_amount_minor
      - enabled
    RoutingEvaluation:
      type: object
      additionalProperties: false
      properties:
        payment_method_id: *id002
        amount_minor: *id007
        currency: *id008
        payment_id:
          type: string
          description: Optional existing payment; an unresolved prior attempt blocks failover.
      required:
      - payment_method_id
      - amount_minor
      - currency
    RoutingCheck:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        passed:
          type: boolean
        detail:
          type: string
      required:
      - id
      - label
      - passed
      - detail
    RoutingDecision:
      type: object
      additionalProperties: false
      properties:
        provider_id:
          type: string
        provider_code:
          type: string
          enum:
          - mock
          - stripe
          - plaid
        rule_id:
          type: string
          nullable: true
        priority:
          type: integer
          minimum: 0
          nullable: true
        reason:
          type: string
        rule:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/RoutingRule'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/RoutingCheck'
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              provider_id:
                type: string
              provider_code:
                type: string
              rule_id:
                type: string
              priority:
                type: integer
            required:
            - provider_id
            - provider_code
            - rule_id
            - priority
        failover_blocked:
          type: boolean
      required:
      - provider_id
      - provider_code
      - rule_id
      - priority
      - reason
      - rule
      - checks
      - candidates
      - failover_blocked
    LedgerJournal:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        payment_id:
          type: string
          format: uuid
          nullable: true
        currency: *id008
        status:
          type: string
          enum:
          - posted
        posting_key: *id005
        reversal_of:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        posted_at:
          type: string
          format: date-time
        entries:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            properties:
              id: *id002
              account_id: *id002
              account_code:
                type: string
                description: merchant_payable or provider_clearing:{provider_id}
              provider_id:
                type: string
                format: uuid
                nullable: true
              side:
                type: string
                enum:
                - debit
                - credit
              amount_minor: *id007
            required:
            - id
            - account_id
            - account_code
            - provider_id
            - side
            - amount_minor
      required:
      - id
      - payment_id
      - currency
      - status
      - posting_key
      - reversal_of
      - created_at
      - posted_at
      - entries
    ReconciliationRun:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
      required:
      - id
      - status
    Discrepancy:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        kind:
          type: string
          enum:
          - missing_posting
          - unknown_outcome
          - amount_mismatch
          - status_mismatch
          - missing_at_provider
        status:
          type: string
          enum:
          - open
          - investigating
          - resolved
      required:
      - id
      - kind
      - status
    Event:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        event_type: *id005
        status: *id005
        data_source: *id005
      required:
      - id
      - event_type
      - status
      - data_source
    SimulationRequest:
      type: object
      additionalProperties: false
      properties:
        scenario:
          type: string
          enum:
          - success
          - decline
          - timeout_before_execution
          - timeout_after_success
          - duplicate_request
          - duplicate_webhook
          - reordered_events
          - outage
          - unknown_recovery
          - duplicate_posting
        seed:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: Default "default". Fixes the amount, so the same seed reproduces the same states.
        amount_minor:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Overrides the seed-derived amount.
        currency:
          type: string
          description: Defaults to USD.
      required:
      - scenario
    ScenarioCatalog:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              label:
                type: string
              description:
                type: string
              implemented:
                type: boolean
              missing_dependency:
                type: string
                nullable: true
              injected_fault:
                type: string
            required:
            - id
            - label
            - description
            - implemented
            - missing_dependency
            - injected_fault
      required:
      - label
      - items
    SimulationInvariant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
          - pending
          - pass
          - fail
        evidence:
          type: string
      required:
      - id
      - title
      - status
      - evidence
    Simulation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
          description: Always SIMULATED / SANDBOX ONLY.
        scenario:
          type: string
        seed:
          type: string
        status:
          type: string
          enum:
          - running
          - completed
          - failed
        payment_id:
          type: string
          nullable: true
        injected_fault:
          type: string
        created_at:
          type: string
        completed_at:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        fingerprint:
          type: string
          nullable: true
          description: Hash of the end state; equal for runs with the same scenario and seed.
        request:
          type: object
          additionalProperties: false
          properties:
            payment_method_id:
              type: string
            amount_minor:
              type: string
            currency:
              type: string
            idempotency_key:
              type: string
            merchant_reference:
              type: string
          required:
          - payment_method_id
          - amount_minor
          - currency
          - idempotency_key
          - merchant_reference
        response:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            status_code:
              type: integer
            body:
              type: object
              additionalProperties: true
          required:
          - status_code
          - body
        payment:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Payment'
        routing:
          type: object
          additionalProperties: false
          properties:
            failover_blocked:
              type: boolean
            failover_reason:
              type: string
              nullable: true
            decisions:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  attempt_number:
                    type: integer
                  provider_id:
                    type: string
                  rule_id:
                    type: string
                    nullable: true
                  reason:
                    type: string
                required:
                - attempt_number
                - provider_id
                - rule_id
                - reason
          required:
          - failover_blocked
          - failover_reason
          - decisions
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
        transitions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              from_status:
                type: string
                nullable: true
              to_status:
                type: string
              reason:
                type: string
              actor_reference:
                type: string
              created_at:
                type: string
            required:
            - from_status
            - to_status
            - reason
            - actor_reference
            - created_at
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              event_type:
                type: string
              status:
                type: string
              attempts:
                type: integer
              created_at:
                type: string
              delivered_at:
                type: string
                nullable: true
            required:
            - id
            - event_type
            - status
            - attempts
            - created_at
            - delivered_at
        journals:
          type: array
          items:
            $ref: '#/components/schemas/LedgerJournal'
        invariants:
          type: array
          items:
            $ref: '#/components/schemas/SimulationInvariant'
        timeline:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              at:
                type: string
              source:
                type: string
              title:
                type: string
              detail:
                type: string
            required:
            - at
            - source
            - title
            - detail
      required:
      - id
      - label
      - scenario
      - seed
      - status
      - payment_id
      - injected_fault
      - created_at
      - completed_at
      - failure_reason
      - fingerprint
      - request
      - response
      - payment
      - routing
      - attempts
      - transitions
      - events
      - journals
      - invariants
      - timeline
    DataSource:
      type: string
      enum:
      - observed
      - simulated
      - seeded
    MetricWindow:
      type: string
      enum:
      - 24h
      - 7d
      - 30d
    AggregateAmount:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      description: Exact non-negative sum of minor units as a decimal string; may exceed int64.
    CurrencyVolume:
      type: object
      additionalProperties: false
      properties:
        currency: *id009
        amount_minor:
          $ref: '#/components/schemas/AggregateAmount'
        payment_count:
          type: integer
          minimum: 0
      required:
      - currency
      - amount_minor
      - payment_count
    PaymentHistory:
      type: object
      additionalProperties: false
      properties:
        payment_id: *id006
        idempotency_key_masked:
          type: string
          nullable: true
          maxLength: 8
        transitions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              from_status:
                type: string
                nullable: true
                enum:
                - created
                - processing
                - succeeded
                - failed
                - canceled
                - unknown
                - null
              to_status:
                $ref: '#/components/schemas/PaymentStatus'
              reason:
                type: string
              actor_reference:
                type: string
              created_at:
                type: string
                format: date-time
            required:
            - from_status
            - to_status
            - reason
            - actor_reference
            - created_at
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: *id006
              event_type:
                type: string
              status:
                type: string
              attempts:
                type: integer
                minimum: 0
              created_at:
                type: string
                format: date-time
              delivered_at:
                type: string
                format: date-time
                nullable: true
            required:
            - id
            - event_type
            - status
            - attempts
            - created_at
            - delivered_at
      required:
      - payment_id
      - idempotency_key_masked
      - transitions
      - events
  responses:
    Error:
      description: Safe error envelope; code describes validation, authorization, rate limits, missing
        resources or unimplemented capability.
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
