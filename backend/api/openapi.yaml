                      $ref: '#/components/schemas/ReconciliationRun'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '400': *id001
        '401': *id001
        '403': *id001
        '429': *id001
        '503': *id001
      parameters:
      - name: cursor
        in: query
        required: false
