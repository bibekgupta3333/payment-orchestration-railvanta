          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments:
    get:
      operationId: listPayments
      summary: List workspace payments
      description: Newest-first keyset pagination over the authenticated workspace's
        payments. Pass next_cursor back as cursor; it is opaque. Optional status filter.
      tags:
      - Sandbox
      responses:
        default: *id001
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  next_cursor:
                    type: string
                    nullable: true
                required:
                - items
                - next_cursor
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id003
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PaymentStatus'
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
    post:
      operationId: createPayment
      summary: Accept a sandbox payment
      description: Idempotently accepts a payment. One short transaction reserves
        (workspace, operation, Idempotency-Key), inserts the payment and its initial
        audit transition, appends a payment.dispatch outbox command and stores this
        202 response. Reusing the key with the same canonical request (amount, currency,
        payment method, merchant reference) replays the stored body byte-for-byte with
        Idempotent-Replayed true; a different request returns 409 idempotency_conflict.
        Validation and authorization failures never reserve the key. The method must
        belong to the workspace (else 404) and hold a provider token (else 422).
      tags:
      - Sandbox
      responses:
        default: *id001
        '202':
          description: Accepted (or replayed); poll the Location for current state
          headers:
            X-Request-ID:
              schema:
                type: string
            Location:
              description: Relative URL of the accepted payment
              schema:
                type: string
            Idempotent-Replayed:
              description: Present and true when the stored response is replayed
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '413': *id001
        '415': *id001
        '422': *id001
        '429': *id001
        '500': *id001
        '503': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - name: X-CSRF-Token
        in: header
        required: false
        schema: *id003
        description: Required with a valid Origin for cookie-authenticated writes.
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
  /v1/payments/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id002
    get:
      operationId: getPayment
      summary: Read a payment
      description: Returns current state, independent of the original acceptance
