      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - name: X-CSRF-Token
        in: header
        required: false
        schema: *id005
        description: Required with a valid Origin for cookie-authenticated writes.
      - name: X-Request-ID
        in: header
        required: false
        schema:
