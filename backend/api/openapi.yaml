      properties:
        payment_id: *id006
        idempotency_key_masked:
          type: string
          nullable: true
          maxLength: 8
        transitions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              from_status:
                type: string
                nullable: true
                enum:
                - created
                - processing
                - succeeded
                - failed
                - canceled
